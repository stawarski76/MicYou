[package]
name = "micyou-core"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
description = "MicYou audio server core shared by the GUI, CLI and TUI"

[features]
default = ["vbcable", "web-server"]
vbcable = []
web-server = ["dep:axum"]
# OS-level desktop integration for frontends without a window toolkit.
headless-host = ["dep:open", "dep:notify-rust", "dep:global-hotkey"]

[dependencies]
micyou-audio = { workspace = true, features = ["dsp", "noise-suppression"] }
micyou-plugin.workspace = true
micyou-protocol.workspace = true

arboard = "3.6.1"
getrandom = "0.4.3"
cpal.workspace = true
hostname = "0.4.2"
local-ip-address = "0.6.13"
log.workspace = true
md-5 = "0.10.6"
mdns-sd = "0.21"
opus-decoder = "0.1.1"
plist = "1.10.1"
prost.workspace = true
reqwest.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10.9"
socket2 = "0.6.4"
subtle = "2.6.1"
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7.18"
zip.workspace = true

axum = { version = "0.8.9", features = ["ws"], optional = true }
rcgen = "0.14"
rustls = "0.23.40"
tokio-rustls = "0.26.4"

global-hotkey = { version = "0.8.0", optional = true }
notify-rust = { version = "4.17.0", optional = true }
open = { version = "5.3.5", optional = true }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# AppKit's resolved accent colour (`NSColor.controlAccentColor`).
objc = "0.2"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3.9", features = ["handleapi", "processthreadsapi", "winnt", "winsock2", "dpapi", "wincrypt", "winbase"] }
winreg = "0.55"
