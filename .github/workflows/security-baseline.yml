name: Security baseline

on:
  push:
    branches: ['codex/security-hardening', 'codex/secure-pairing']
  pull_request:
    branches: ['master', 'codex/security-hardening']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tauri-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: tauri-app/package.json
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run test
      - run: bun run typecheck

  rust:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tauri-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      # The GUI's build script needs separately built release sidecars. Test
      # the full shared backend workspace here; GUI packaging is a later gate.
      - run: cargo test --workspace --exclude micyou-app --locked
      - run: cargo clippy --workspace --exclude micyou-app --all-targets --locked

  android-security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - run: chmod +x gradlew
      - run: ./gradlew :composeApp:testDebugUnitTest :composeApp:assembleDebug --no-daemon
